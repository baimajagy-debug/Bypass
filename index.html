<!DOCTYPE html>
<html>
<head>
    <title>B41M Bypass</title>
    <style>
        body { background: #0a0a0f; color: #fff; font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .box { background: #1a1a2e; padding: 40px; border-radius: 20px; width: 500px; text-align: center; border: 1px solid #8b5cf6; }
        input { width: 100%; padding: 12px; border-radius: 10px; border: none; background: #0d0d1a; color: #fff; margin: 10px 0; }
        button { background: #8b5cf6; color: #fff; padding: 12px 30px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }
        button:hover { background: #6d28d9; }
        #result { margin-top: 20px; word-break: break-all; color: #4ade80; }
        .error { color: #f87171 !important; }
        .footer { margin-top: 30px; font-size: 12px; color: #4a4a6a; }
    </style>
</head>
<body>
<div class="box">
    <h1 style="color: #a78bfa;">B41M</h1>
    <p style="color: #94a3b8;">Bypass SFL.gl & Shortener Lain</p>
    <input type="text" id="url" placeholder="Tempel link shortener..." />
    <button onclick="bypass()">Bypass</button>
    <div id="result"></div>
    <div class="footer">Credits: B41m</div>
</div>
<script>
async function bypass() {
    const url = document.getElementById('url').value;
    const result = document.getElementById('result');
    if (!url) { result.innerHTML = '⚠️ Masukkan link!'; result.className = 'error'; return; }
    result.innerHTML = '⏳ Memproses...';
    result.className = '';
    try {
        const res = await fetch(`/api/bypass?url=${encodeURIComponent(url)}`);
        const data = await res.json();
        if (data.destination) {
            result.innerHTML = `✅ ${data.destination}`;
            result.className = '';
        } else {
            result.innerHTML = `❌ Gagal: ${data.error || 'coba lagi'}`;
            result.className = 'error';
        }
    } catch(e) {
        result.innerHTML = `❌ Error: ${e.message}`;
        result.className = 'error';
    }
}
</script>
</body>
</html>
