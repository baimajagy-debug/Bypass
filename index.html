<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>B41m Bypass</title>
    <style>
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: #0b0d17;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 780px;
            width: 100%;
            background: #121624;
            border-radius: 32px;
            padding: 40px 36px 30px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.2s;
        }

        /* ===== HEADER ===== */
        .header {
            text-align: center;
            margin-bottom: 32px;
        }
        .header h1 {
            font-size: 4rem;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #b388ff, #7c4dff, #536dfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 50px rgba(124, 77, 255, 0.25);
            line-height: 1.1;
        }
        .header .sub {
            color: #a8b2d1;
            font-size: 1rem;
            letter-spacing: 1px;
            margin-top: -4px;
            font-weight: 300;
            background: rgba(255, 255, 255, 0.03);
            display: inline-block;
            padding: 0 20px;
            border-radius: 30px;
            backdrop-filter: blur(4px);
        }

        /* ===== INPUT ===== */
        .input-group {
            background: rgba(10, 12, 24, 0.7);
            border-radius: 60px;
            padding: 4px 4px 4px 24px;
            display: flex;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: border 0.3s, box-shadow 0.3s;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
        }
        .input-group:focus-within {
            border-color: #7c4dff;
            box-shadow: 0 0 0 4px rgba(124, 77, 255, 0.15), inset 0 2px 8px rgba(0, 0, 0, 0.5);
        }
        .input-group input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 16px 10px 16px 0;
            font-size: 1rem;
            color: #e8edf5;
            outline: none;
            font-weight: 400;
        }
        .input-group input::placeholder {
            color: #5a6488;
            font-weight: 300;
        }
        .input-group button {
            background: linear-gradient(135deg, #7c4dff, #651fff);
            border: none;
            padding: 14px 30px;
            border-radius: 40px;
            color: #fff;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 8px 22px rgba(124, 77, 255, 0.35);
            letter-spacing: 0.3px;
            white-space: nowrap;
        }
        .input-group button:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 30px rgba(124, 77, 255, 0.5);
        }
        .input-group button:active {
            transform: scale(0.96);
        }

        /* ===== STATUS ===== */
        .status {
            min-height: 28px;
            margin-bottom: 16px;
            text-align: center;
            font-size: 0.95rem;
            color: #94a3b8;
        }
        .status .loading {
            color: #fbbf24;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .status .loading .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(251, 191, 36, 0.2);
            border-top-color: #fbbf24;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== RESULT ===== */
        .result-box {
            background: rgba(10, 12, 24, 0.6);
            border-radius: 20px;
            padding: 18px 22px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            display: none;
            word-break: break-all;
            margin-bottom: 28px;
        }
        .result-box .label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1.8px;
            color: #6b7aa3;
            margin-bottom: 6px;
        }
        .result-box .link-wrap {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .result-box .link-wrap .link {
            color: #a78bfa;
            font-weight: 500;
            text-decoration: underline;
            text-underline-offset: 3px;
            cursor: pointer;
            transition: 0.2s;
            flex: 1;
        }
        .result-box .link-wrap .link:hover {
            color: #c4b5fd;
        }
        .result-box .copy-btn {
            background: rgba(124, 77, 255, 0.12);
            border: 1px solid rgba(124, 77, 255, 0.15);
            color: #c4b5fd;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        .result-box .copy-btn:hover {
            background: rgba(124, 77, 255, 0.25);
        }

        /* ===== RIWAYAT ===== */
        .history-section {
            margin-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 20px;
        }
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .history-header h3 {
            color: #a8b2d1;
            font-weight: 400;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }
        .history-header .clear-btn {
            background: none;
            border: none;
            color: #6b7aa3;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.2s;
            padding: 4px 12px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.03);
        }
        .history-header .clear-btn:hover {
            color: #f87171;
            background: rgba(248, 113, 113, 0.08);
        }
        .history-list {
            list-style: none;
            max-height: 160px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .history-list::-webkit-scrollbar {
            width: 4px;
        }
        .history-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
        }
        .history-list::-webkit-scrollbar-thumb {
            background: #3b3f5e;
            border-radius: 8px;
        }
        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 14px;
            margin-bottom: 6px;
            border-left: 2px solid #7c4dff;
            transition: 0.15s;
        }
        .history-item:hover {
            background: rgba(255, 255, 255, 0.04);
        }
        .history-item .h-short {
            color: #94a3b8;
            font-size: 0.85rem;
            max-width: 160px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .history-item .h-dest {
            color: #c4b5fd;
            font-size: 0.8rem;
            flex: 1;
            margin: 0 12px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .history-item .h-time {
            color: #4a5478;
            font-size: 0.65rem;
            white-space: nowrap;
        }
        .history-empty {
            color: #4a5478;
            text-align: center;
            font-size: 0.85rem;
            padding: 20px 0;
        }

        /* ===== STATUS MINI ===== */
        .badge-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px 24px;
            margin-top: 24px;
            padding-top: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
        }
        .badge-item {
            color: #6b7aa3;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .badge-item .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #34d399;
            box-shadow: 0 0 12px rgba(52, 211, 153, 0.3);
        }
        .badge-item .dot.uptime {
            background: #34d399;
        }
        .badge-item .dot.ssl {
            background: #60a5fa;
        }
        .badge-item .dot.edge {
            background: #fbbf24;
        }

        /* ===== FOOTER ===== */
        .footer {
            text-align: center;
            margin-top: 28px;
            font-size: 0.8rem;
            color: #4a5478;
            letter-spacing: 0.3px;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            padding-top: 20px;
        }
        .footer .gang {
            color: #b388ff;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }
        .footer .credit {
            margin-top: 4px;
            font-size: 0.7rem;
            color: #5a6488;
        }
        .footer .credit strong {
            color: #a78bfa;
            font-weight: 600;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 520px) {
            .container {
                padding: 28px 16px 24px;
                border-radius: 24px;
            }
            .header h1 {
                font-size: 2.8rem;
            }
            .input-group {
                flex-wrap: wrap;
                background: transparent;
                padding: 0;
                border: none;
                box-shadow: none;
                gap: 12px;
            }
            .input-group input {
                background: rgba(10, 12, 24, 0.7);
                border-radius: 60px;
                padding: 16px 20px;
                border: 1px solid rgba(255, 255, 255, 0.06);
                width: 100%;
                box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.5);
            }
            .input-group button {
                width: 100%;
                justify-content: center;
                padding: 16px;
            }
            .result-box .link-wrap {
                flex-direction: column;
                align-items: stretch;
            }
            .history-item {
                flex-wrap: wrap;
                gap: 4px 8px;
            }
            .history-item .h-short {
                max-width: 100px;
            }
            .history-item .h-dest {
                flex-basis: 100%;
                margin: 4px 0;
            }
            .badge-row {
                gap: 8px 16px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ===== HEADER ===== -->
        <div class="header">
            <h1>Bypass</h1>
            <div class="sub">Bypass Link SFL · Lau</div>
        </div>

        <!-- ===== INPUT ===== -->
        <div class="input-group">
            <input type="url" id="linkInput" placeholder="Paste your link here (e.g., https://sfl.gl/...)" autofocus />
            <button id="bypassBtn">Process Bypass →</button>
        </div>

        <!-- ===== STATUS ===== -->
        <div class="status" id="statusMessage">
            <span>🔗 Masukkan link pendek untuk diproses</span>
        </div>

        <!-- ===== RESULT ===== -->
        <div class="result-box" id="resultBox">
            <div class="label">✅ Link Asli</div>
            <div class="link-wrap">
                <span class="link" id="resultLink" target="_blank">—</span>
                <button class="copy-btn" id="copyBtn">📋 Salin</button>
            </div>
        </div>

        <!-- ===== RIWAYAT ===== -->
        <div class="history-section">
            <div class="history-header">
                <h3>📋 RIWAYAT TERAKHIR (<span id="historyCount">0</span>)</h3>
                <button class="clear-btn" id="clearHistoryBtn">HAPUS SEMUA</button>
            </div>
            <ul class="history-list" id="historyList">
                <li class="history-empty">Belum ada riwayat.</li>
            </ul>
        </div>

        <!-- ===== BADGE ROW ===== -->
        <div class="badge-row">
            <span class="badge-item"><span class="dot uptime"></span> 100% Uptime</span>
            <span class="badge-item"><span class="dot ssl"></span> SSL Encrypted</span>
            <span class="badge-item"><span class="dot edge"></span> Vercel Edge Ready</span>
        </div>

        <!-- ===== FOOTER ===== -->
        <div class="footer">
            <div class="gang">⚡ BATUKAM GANG</div>
            <div class="credit">built by <strong>B41m</strong> · code by <strong>Zamzzz</strong></div>
        </div>

    </div>

    <script>
        (function() {
            'use strict';

            // DOM refs
            const linkInput = document.getElementById('linkInput');
            const bypassBtn = document.getElementById('bypassBtn');
            const statusEl = document.getElementById('statusMessage');
            const resultBox = document.getElementById('resultBox');
            const resultLink = document.getElementById('resultLink');
            const copyBtn = document.getElementById('copyBtn');
            const historyList = document.getElementById('historyList');
            const historyCount = document.getElementById('historyCount');
            const clearHistoryBtn = document.getElementById('clearHistoryBtn');

            // API endpoint bypass.vip
            const API_URL = 'https://api.bypass.vip/';

            // ---------- HISTORY (localStorage) ----------
            function loadHistory() {
                try {
                    const raw = localStorage.getItem('b41m_history');
                    return raw ? JSON.parse(raw) : [];
                } catch {
                    return [];
                }
            }

            function saveHistory(history) {
                localStorage.setItem('b41m_history', JSON.stringify(history));
            }

            function addHistory(shortUrl, destination) {
                const history = loadHistory();
                const entry = {
                    short: shortUrl,
                    dest: destination,
                    time: new Date().toLocaleString('id-ID', { hour12: false })
                };
                // hindari duplikat (jika sama persis)
                const exists = history.some(h => h.dest === destination && h.short === shortUrl);
                if (!exists) {
                    history.unshift(entry);
                    if (history.length > 50) history.pop(); // batasi
                    saveHistory(history);
                }
                renderHistory();
            }

            function clearHistory() {
                if (confirm('Hapus semua riwayat?')) {
                    saveHistory([]);
                    renderHistory();
                }
            }

            function renderHistory() {
                const history = loadHistory();
                historyCount.textContent = history.length;
                if (history.length === 0) {
                    historyList.innerHTML = '<li class="history-empty">Belum ada riwayat.</li>';
                    return;
                }
                let html = '';
                history.forEach(item => {
                    const shortDisplay = item.short.length > 40 ? item.short.slice(0, 40) + '…' : item.short;
                    const destDisplay = item.dest.length > 60 ? item.dest.slice(0, 60) + '…' : item.dest;
                    html += `
                        <li class="history-item">
                            <span class="h-short" title="${item.short}">${shortDisplay}</span>
                            <span class="h-dest" title="${item.dest}">${destDisplay}</span>
                            <span class="h-time">${item.time}</span>
                        </li>
                    `;
                });
                historyList.innerHTML = html;
            }

            // ---------- BYPASS ----------
            async function bypassShortlink(url) {
                if (!url || !url.trim()) {
                    statusEl.innerHTML = `<span style="color: #fbbf24;">⚠️ Masukkan link terlebih dahulu.</span>`;
                    return;
                }
                // tambahkan protokol jika tidak ada
                if (!/^https?:\/\//i.test(url)) {
                    url = 'https://' + url;
                }

                statusEl.innerHTML = `
                    <div class="loading">
                        <span class="spinner"></span>
                        Sedang memproses...
                    </div>
                `;
                resultBox.style.display = 'none';

                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ url: url })
                    });

                    if (!response.ok) {
                        throw new Error(`Server merespon ${response.status}`);
                    }

                    const data = await response.json();
                    if (data && data.destination) {
                        const dest = data.destination;
                        statusEl.innerHTML = `<span style="color: #34d399;">✅ Bypass berhasil!</span>`;
                        resultLink.textContent = dest;
                        resultLink.href = dest;
                        resultBox.style.display = 'block';
                        // simpan riwayat
                        addHistory(url, dest);
                    } else {
                        const msg = data.message || 'Gagal memproses link. Coba lagi.';
                        throw new Error(msg);
                    }
                } catch (error) {
                    statusEl.innerHTML = `<span style="color: #f87171;">❌ ${error.message}</span>`;
                    resultBox.style.display = 'none';
                }
            }

            // ---------- EVENT LISTENERS ----------
            bypassBtn.addEventListener('click', function() {
                bypassShortlink(linkInput.value.trim());
            });

            linkInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    bypassBtn.click();
                }
            });

            copyBtn.addEventListener('click', function() {
                const link = resultLink.textContent;
                if (!link || link === '—') return;
                navigator.clipboard.writeText(link).then(() => {
                    copyBtn.textContent = '✅ Disalin!';
                    setTimeout(() => { copyBtn.textContent = '📋 Salin'; }, 1800);
                }).catch(() => {
                    // fallback
                    const ta = document.createElement('textarea');
                    ta.value = link;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    copyBtn.textContent = '✅ Disalin!';
                    setTimeout(() => { copyBtn.textContent = '📋 Salin'; }, 1800);
                });
            });

            clearHistoryBtn.addEventListener('click', clearHistory);

            // ---------- INIT ----------
            renderHistory();
            linkInput.focus();
        })();
    </script>

</body>
</html>
