<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#08150e">
<title>Baim Bypass</title>
<style>
:root{
  --bg:#f3f5f8;
  --card:#fff;
  --text:#101827;
  --muted:#8190a3;
  --line:#e9edf2;
  --green:#51c9a8;
  --green-dark:#149c78;
  --green-soft:#e5f8f1;
  --shadow:0 18px 55px rgba(28,43,61,.08);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
body{
  background:
    radial-gradient(circle at 50% 18%,rgba(81,201,168,.08),transparent 27%),
    var(--bg);
}
button,input{font:inherit}
button{cursor:pointer;border:0}
.header{
  height:86px;background:#07130d;color:white;display:flex;align-items:center;
  padding:0 30px;box-shadow:0 2px 15px rgba(0,0,0,.08)
}
.brand{display:flex;align-items:center;gap:15px;font-weight:800;font-size:26px;letter-spacing:-1px}
.logo{
  width:51px;height:51px;border-radius:12px;background:#05070a;display:grid;place-items:center;
  font-size:25px;font-weight:900;box-shadow:0 5px 14px rgba(0,0,0,.2)
}
.online{margin-left:auto;width:13px;height:13px;background:var(--green);border-radius:50%;box-shadow:0 0 0 5px rgba(81,201,168,.08)}
.page{max-width:700px;margin:0 auto;padding:92px 20px 70px}
.card{
  background:var(--card);border-radius:31px;padding:34px 30px 30px;
  box-shadow:var(--shadow);border:1px solid rgba(235,239,244,.75)
}
.hero{text-align:center}
.hero h1{font-size:36px;line-height:1;margin:0 0 17px;font-weight:900;letter-spacing:-1.8px}
.hero p{margin:0;color:#7c8999;font-size:18px}
.form{margin-top:46px}
.label{
  display:block;color:#8794a5;font-size:17px;font-weight:700;margin:0 0 17px 5px;
  letter-spacing:.3px
}
.input-wrap{position:relative}
input{
  width:100%;height:88px;border-radius:20px;border:2px solid #edf0f4;background:#fafbfd;
  outline:none;padding:0 25px;font-size:20px;color:var(--text);transition:.2s
}
input::placeholder{color:#9aa7b7}
input:focus{border-color:#8ddbc5;background:white;box-shadow:0 0 0 4px rgba(81,201,168,.1)}
.process{
  width:100%;height:86px;margin-top:30px;border-radius:20px;background:#8c8c8c;color:#fff;
  font-size:22px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:16px;
  transition:.2s;position:relative;overflow:hidden
}
.process:not(:disabled):hover{background:#727272;transform:translateY(-1px)}
.process:not(:disabled):active{transform:translateY(1px)}
.process:disabled{cursor:not-allowed;opacity:.72}
.arrow{font-size:31px;font-weight:400;line-height:0}
.process.loading .arrow{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.credit{
  margin-top:39px;padding:31px 0 38px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  text-align:center
}
.shield{font-size:19px;color:#95a3b4;margin-right:8px}
.credit-title{color:#99a6b6;font-weight:800;letter-spacing:.7px}
.credit-name{margin-top:18px;color:#9ba7b5;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.credit-name b{color:#445060}

.history{padding-top:31px}
.history-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.history-title{font-size:16px;color:#98a5b5;font-weight:900;letter-spacing:.8px}
.clear{background:transparent;color:#e33f76;font-weight:900;font-size:16px}
.clear:hover{text-decoration:underline}
.empty{padding:31px 5px 7px;color:#a2adba;text-align:center;font-size:15px}
.history-list{margin-top:24px;display:grid;gap:13px}
.item{
  background:#f8fafc;border-radius:21px;padding:15px 13px 15px 19px;
  display:flex;align-items:center;gap:12px;min-width:0
}
.item-info{min-width:0;flex:1}
.meta{display:flex;align-items:center;gap:10px;color:#99a5b4;font-size:13px;margin-bottom:8px}
.badge{background:#e8edf3;color:#657386;padding:4px 8px;border-radius:6px;font-weight:800;font-size:12px}
.url,.result{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis
}
.url{color:#6c7888}
.result{color:#1d2735;font-weight:700;margin-top:4px}
.actions{display:flex;gap:8px}
.icon-btn{
  flex:0 0 46px;width:46px;height:46px;border-radius:14px;background:#edf2f7;color:#718095;
  display:grid;place-items:center;font-size:20px;transition:.2s
}
.icon-btn:hover{background:#e1e8ef;transform:translateY(-1px)}
.stats{
  display:grid;grid-template-columns:repeat(3,1fr);gap:20px;max-width:570px;margin:52px auto 0;text-align:center
}
.stat b{display:block;font-size:30px;letter-spacing:-1px}
.stat:nth-child(2) b{color:var(--green-dark)}
.stat span{display:block;margin-top:9px;color:#9aa6b5;font-size:12px;font-weight:800;letter-spacing:1.4px}
.toast{
  position:fixed;left:50%;bottom:25px;transform:translate(-50%,20px);opacity:0;
  background:#101827;color:white;border-radius:14px;padding:13px 18px;font-weight:700;
  box-shadow:0 12px 30px rgba(0,0,0,.18);pointer-events:none;transition:.25s;z-index:20
}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:560px){
  .header{height:82px;padding:0 20px}
  .brand{font-size:23px;gap:12px}.logo{width:51px;height:51px}
  .page{padding:54px 20px 55px}
  .card{border-radius:29px;padding:31px 20px 24px}
  .hero h1{font-size:33px}.hero p{font-size:16px}
  .form{margin-top:42px}.label{font-size:16px}
  input{height:88px;font-size:18px;padding:0 22px}
  .process{height:86px;font-size:20px;margin-top:30px}
  .credit{margin-top:38px}
  .history-head{align-items:flex-start}.history-title,.clear{font-size:14px}
  .item{padding-left:15px}.url,.result{font-size:13px}
  .icon-btn{width:42px;height:42px;flex-basis:42px}
  .stats{margin-top:45px;gap:8px}.stat b{font-size:27px}.stat span{font-size:10px}
}
</style>
</head>
<body>
<header class="header">
  <div class="brand"><div class="logo">B</div><span>Baim Bypass</span></div>
  <div class="online" title="Online"></div>
</header>

<main class="page">
  <section class="card">
    <div class="hero">
      <h1>Bypass</h1>
      <p>Bypass Link SFL Kamu</p>
    </div>

    <form class="form" id="bypassForm">
      <label class="label" for="url">URL</label>
      <div class="input-wrap">
        <input id="url" type="url" autocomplete="off"
          placeholder="Paste your link here (e.g., https://sfl.gl/...)" required>
      </div>
      <button class="process" id="processBtn" type="submit">
        <span id="btnText">Process Bypass</span><span class="arrow" id="arrow">→</span>
      </button>
    </form>

    <div class="credit">
      <div><span class="shield">♢</span><span class="credit-title">BAIM GANG</span></div>
      <div class="credit-name">Credits: <b>Baim</b></div>
    </div>

    <section class="history">
      <div class="history-head">
        <div class="history-title">↶ &nbsp; RIWAYAT TERAKHIR (<span id="count">0</span>)</div>
        <button class="clear" id="clearBtn" type="button">♜ HAPUS SEMUA</button>
      </div>
      <div id="historyList" class="history-list"></div>
      <div id="empty" class="empty">Belum ada riwayat.</div>
    </section>
  </section>

  <section class="stats">
    <div class="stat"><b>100%</b><span>UPTIME</span></div>
    <div class="stat"><b>SSL</b><span>ENCRYPTED</span></div>
    <div class="stat"><b>Vercel</b><span>EDGE READY</span></div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = "baim_bypass_history_v1";
const form = document.getElementById("bypassForm");
const input = document.getElementById("url");
const btn = document.getElementById("processBtn");
const btnText = document.getElementById("btnText");
const arrow = document.getElementById("arrow");
const list = document.getElementById("historyList");
const empty = document.getElementById("empty");
const count = document.getElementById("count");
const toast = document.getElementById("toast");

function getHistory(){
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch { return []; }
}
function saveHistory(data){ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

function showToast(message){
  toast.textContent = message;
  toast.classList.add("show");
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(()=>toast.classList.remove("show"),2200);
}

function escapeHtml(value){
  return value.replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function renderHistory(){
  const data = getHistory();
  count.textContent = data.length;
  empty.style.display = data.length ? "none" : "block";
  list.innerHTML = data.map((item,index)=>`
    <div class="item">
      <div class="item-info">
        <div class="meta"><span class="badge">SFL</span><span>${escapeHtml(item.time)}</span></div>
        <div class="url">${escapeHtml(item.original)}</div>
        <div class="result">${escapeHtml(item.result)}</div>
      </div>
      <div class="actions">
        <button class="icon-btn" type="button" title="Copy" onclick="copyResult(${index})">▣</button>
        <button class="icon-btn" type="button" title="Hapus" onclick="deleteItem(${index})">♜</button>
      </div>
    </div>
  `).join("");
}

async function copyText(text){
  try{
    await navigator.clipboard.writeText(text);
    showToast("Hasil disalin ✓");
  }catch{
    showToast("Gagal menyalin");
  }
}

window.copyResult = async function(index){
  const data = getHistory();
  if(data[index]) await copyText(data[index].result);
};

window.deleteItem = function(index){
  const data = getHistory();
  data.splice(index,1);
  saveHistory(data);
  renderHistory();
  showToast("Riwayat dihapus");
};

document.getElementById("clearBtn").addEventListener("click",()=>{
  if(!getHistory().length) return showToast("Riwayat masih kosong");
  localStorage.removeItem(STORAGE_KEY);
  renderHistory();
  showToast("Semua riwayat dihapus");
});

form.addEventListener("submit", async (e)=>{
  e.preventDefault();
  const value = input.value.trim();
  if(!value) return;
  try{
    new URL(value);
  }catch{
    showToast("Masukkan URL yang valid");
    input.focus();
    return;
  }

  btn.disabled = true;
  btn.classList.add("loading");
  btnText.textContent = "Processing...";
  arrow.textContent = "↻";

  /*
    DEMO FRONTEND:
    Bagian ini sengaja tidak melakukan bypass sungguhan.
    Untuk produksi, ganti blok timeout di bawah dengan fetch()
    ke backend/API milikmu yang sah.
  */
  await new Promise(resolve => setTimeout(resolve, 1100));

  const data = getHistory();
  const result = "https://example.com/result/" + Math.random().toString(36).slice(2,10);
  const now = new Date();
  const time = now.toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"});
  data.unshift({original:value,result,time});
  saveHistory(data.slice(0,20));
  renderHistory();

  btn.disabled = false;
  btn.classList.remove("loading");
  btnText.textContent = "Process Bypass";
  arrow.textContent = "→";
  input.value = "";
  showToast("Proses selesai ✓");
});

renderHistory();
</script>
</body>
</html>
