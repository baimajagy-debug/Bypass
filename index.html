<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>B41m – Bypass Shortlink</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #0d0f1a 0%, #1a1e2f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(22, 26, 40, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 40px;
            padding: 40px 35px;
            width: 100%;
            max-width: 640px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.3s;
        }

        .logo {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo h1 {
            font-size: 3.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #f0b3ff, #8b5cf6, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
            text-shadow: 0 0 40px rgba(139, 92, 246, 0.3);
        }

        .logo .sub {
            color: #a8b2d1;
            font-size: 0.95rem;
            letter-spacing: 2px;
            margin-top: -8px;
            font-weight: 300;
            background: rgba(255, 255, 255, 0.03);
            display: inline-block;
            padding: 0 18px;
            border-radius: 30px;
            backdrop-filter: blur(4px);
        }

        .input-group {
            background: rgba(12, 15, 28, 0.7);
            border-radius: 60px;
            padding: 6px 6px 6px 24px;
            display: flex;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: border 0.3s, box-shadow 0.3s;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        .input-group:focus-within {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.2), inset 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        .input-group input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 16px 10px 16px 0;
            font-size: 1rem;
            color: #e2e8f0;
            outline: none;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        .input-group input::placeholder {
            color: #5a6488;
            font-weight: 300;
        }

        .input-group button {
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            border: none;
            padding: 14px 28px;
            border-radius: 40px;
            color: white;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.25s;
            box-shadow: 0 8px 20px rgba(139, 92, 246, 0.3);
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .input-group button:hover {
            transform: scale(1.02);
            box-shadow: 0 12px 28px rgba(139, 92, 246, 0.5);
        }

        .input-group button:active {
            transform: scale(0.96);
        }

        .status {
            margin: 24px 0 8px;
            min-height: 28px;
            text-align: center;
            font-size: 0.95rem;
            color: #94a3b8;
        }

        .status .loading {
            color: #fbbf24;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .status .loading .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(251, 191, 36, 0.2);
            border-top-color: #fbbf24;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .result-box {
            background: rgba(12, 15, 28, 0.6);
            border-radius: 20px;
            padding: 18px 22px;
            margin-top: 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            display: none;
            word-break: break-all;
        }

        .result-box .label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #6b7aa3;
            margin-bottom: 6px;
        }

        .result-box .link {
            color: #a78bfa;
            font-weight: 500;
            text-decoration: underline;
            text-underline-offset: 3px;
            cursor: pointer;
            transition: 0.2s;
        }

        .result-box .link:hover {
            color: #c4b5fd;
        }

        .result-box .copy-btn {
            background: rgba(139, 92, 246, 0.15);
            border: 1px solid rgba(139, 92, 246, 0.2);
            color: #c4b5fd;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
            margin-left: 12px;
        }

        .result-box .copy-btn:hover {
            background: rgba(139, 92, 246, 0.25);
        }

        .footer {
            margin-top: 32px;
            text-align: center;
            font-size: 0.8rem;
            color: #4a5478;
            letter-spacing: 0.5px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 22px;
        }

        .footer a {
            color: #8b5cf6;
            text-decoration: none;
            font-weight: 500;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        .footer .credit {
            margin-top: 6px;
            color: #5a6488;
            font-size: 0.75rem;
        }

        .footer .credit strong {
            color: #a78bfa;
            font-weight: 600;
        }

        /* responsif */
        @media (max-width: 480px) {
            .container {
                padding: 28px 18px;
            }
            .logo h1 {
                font-size: 2.4rem;
            }
            .input-group {
                flex-wrap: wrap;
                background: transparent;
                padding: 0;
                border: none;
                box-shadow: none;
                gap: 12px;
            }
            .input-group input {
                background: rgba(12, 15, 28, 0.7);
                border-radius: 60px;
                padding: 16px 20px;
                border: 1px solid rgba(255, 255, 255, 0.06);
                width: 100%;
            }
            .input-group button {
                width: 100%;
                justify-content: center;
                padding: 16px;
            }
            .result-box {
                padding: 14px 16px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- Logo -->
        <div class="logo">
            <h1>B41m</h1>
            <div class="sub">⚡ bypass shortlink instan</div>
        </div>

        <!-- Input -->
        <div class="input-group">
            <input type="url" id="linkInput" placeholder="https://shortlink.com/abc123" autofocus />
            <button id="bypassBtn">➜ Bypass</button>
        </div>

        <!-- Status -->
        <div class="status" id="statusMessage">
            <span>🔗 Masukkan link pendek untuk diproses</span>
        </div>

        <!-- Hasil -->
        <div class="result-box" id="resultBox">
            <div class="label">✅ Link Asli</div>
            <div style="display: flex; align-items: center; flex-wrap: wrap; gap: 8px;">
                <span class="link" id="resultLink" target="_blank">—</span>
                <button class="copy-btn" id="copyBtn">📋 Salin</button>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <span>⚡ powered by <a href="https://bypass.vip" target="_blank">bypass.vip</a></span>
            <div class="credit">
                dibuat oleh <strong>B41m</strong> · <span style="color: #3b82f6;">code</span> by <strong>Zamzzz</strong>
            </div>
        </div>

    </div>

    <script>
        (function() {
            const linkInput = document.getElementById('linkInput');
            const bypassBtn = document.getElementById('bypassBtn');
            const statusEl = document.getElementById('statusMessage');
            const resultBox = document.getElementById('resultBox');
            const resultLink = document.getElementById('resultLink');
            const copyBtn = document.getElementById('copyBtn');

            // API endpoint dari bypass.vip (gratis, tanpa auth)
            const API_URL = 'https://api.bypass.vip/';

            async function bypassShortlink(url) {
                // Validasi URL
                if (!url || !url.trim()) {
                    throw new Error('Masukkan link yang valid.');
                }
                // Tambahkan http:// jika tidak ada protokol
                if (!/^https?:\/\//i.test(url)) {
                    url = 'https://' + url;
                }

                // Tampilkan loading
                statusEl.innerHTML = `
                    <div class="loading">
                        <span class="spinner"></span>
                        Sedang memproses...
                    </div>
                `;

                // Sembunyikan hasil sebelumnya
                resultBox.style.display = 'none';

                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ url: url })
                    });

                    if (!response.ok) {
                        throw new Error(`Server merespon dengan status ${response.status}`);
                    }

                    const data = await response.json();

                    // Cek apakah ada field 'destination' (hasil bypass)
                    if (data && data.destination) {
                        // Sukses
                        statusEl.innerHTML = `<span style="color: #34d399;">✅ Bypass berhasil!</span>`;
                        resultLink.textContent = data.destination;
                        resultLink.href = data.destination;
                        resultBox.style.display = 'block';
                    } else {
                        // Mungkin error atau tidak ada destination
                        const msg = data.message || 'Gagal memproses link. Coba lagi.';
                        throw new Error(msg);
                    }

                } catch (error) {
                    statusEl.innerHTML = `<span style="color: #f87171;">❌ ${error.message}</span>`;
                    resultBox.style.display = 'none';
                }
            }

            // Event listener tombol
            bypassBtn.addEventListener('click', async function() {
                const rawLink = linkInput.value.trim();
                if (!rawLink) {
                    statusEl.innerHTML = `<span style="color: #fbbf24;">⚠️ Masukkan link terlebih dahulu.</span>`;
                    return;
                }
                await bypassShortlink(rawLink);
            });

            // Enter key
            linkInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    bypassBtn.click();
                }
            });

            // Copy to clipboard
            copyBtn.addEventListener('click', function() {
                const link = resultLink.textContent;
                if (!link || link === '—') return;
                navigator.clipboard.writeText(link).then(() => {
                    copyBtn.textContent = '✅ Disalin!';
                    setTimeout(() => {
                        copyBtn.textContent = '📋 Salin';
                    }, 2000);
                }).catch(() => {
                    // Fallback
                    const textArea = document.createElement('textarea');
                    textArea.value = link;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                    copyBtn.textContent = '✅ Disalin!';
                    setTimeout(() => {
                        copyBtn.textContent = '📋 Salin';
                    }, 2000);
                });
            });

            // Auto-fokus
            linkInput.focus();
        })();
    </script>

</body>
</html>
